<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">Sift - the verdict</title>
  <desc id="desc">A gold loot gem with a decisive check cut through its facets.</desc>
  <defs>
    <linearGradient id="ground" x2="0.7" y2="1">
      <stop stop-color="#24343a"/><stop offset="1" stop-color="#0b131b"/>
    </linearGradient>
    <linearGradient id="gold" x1="0.2" x2="0.8" y2="1">
      <stop stop-color="#fff0bf"/><stop offset="0.5" stop-color="#e8b458"/><stop offset="1" stop-color="#b77b35"/>
    </linearGradient>
    <mask id="cut">
      <rect width="256" height="256" fill="white"/>
      <path d="M77 115L113 151L198 66" fill="none" stroke="black" stroke-width="20" stroke-linejoin="miter"/>
    </mask>
  </defs>
  <g id="background">
    <circle cx="128" cy="128" r="124" fill="url(#ground)"/>
    <circle cx="128" cy="128" r="121" fill="none" stroke="#66716a" stroke-opacity="0.5" stroke-width="2"/>
  </g>
  <g id="mark" mask="url(#cut)">
    <path d="M86 51H170L211 105L128 210L45 105Z" fill="url(#gold)"/>
    <path d="M86 51H170L153 105H103Z" fill="#fff0bf"/>
    <path d="M45 105H103L128 210Z" fill="#c08a40"/>
    <path d="M153 105H211L128 210Z" fill="#996130"/>
    <path d="M86 51L45 105H55L90 58H168L170 51Z" fill="#fff4cf"/>
  </g>
</svg>
